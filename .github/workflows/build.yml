name: 🏗️ Build DeviceTracker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # inawasha pipefail ili tee isifiche errors

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📁 Prepare logs folder
        run: mkdir -p logs

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔧 Generate Gradle Wrapper
        run: |
          gradle wrapper --console=plain 2>&1 | tee logs/01-wrapper.log
          chmod +x gradlew

      - name: 🔍 Verify Gradle Wrapper
        run: |
          {
            echo "=== Gradle Wrapper ==="
            ls -lah gradle/wrapper/
            echo "=== Gradle Version ==="
            ./gradlew --version
          } 2>&1 | tee logs/02-verify.log

      - name: 🔨 Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace --info --console=plain \
            2>&1 | tee logs/03-build-full.log

      # ---- Hatua zifuatazo zinaendeshwa hata build ikifeli ----

      - name: 🚨 Extract error logs
        if: always()
        run: |
          grep -nEi \
            "error:|^e: |FAILURE:|FAILED|What went wrong|Exception|Caused by|Execution failed|Could not (resolve|find)|AAPT|Unresolved reference|Duplicate class" \
            logs/*.log > logs/errors.log || echo "Hakuna errors zilizopatikana" > logs/errors.log

          {
            echo "## 🚨 Build Errors"
            echo '```'
            head -n 80 logs/errors.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/
            app/build/reports/
            app/build/outputs/logs/
            **/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 30

      - name: 🚀 Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceTracker-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 📊 APK Info
        if: success()
        run: |
          echo "=== APK iliyotengenezwa ==="
          find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;
