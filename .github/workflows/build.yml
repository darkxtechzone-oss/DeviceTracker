name: 🏗️ Build DeviceTracker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📁 Prepare logs folder
        run: mkdir -p logs

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gundua toleo la AGP, chagua Gradle inayoendana
      - name: 🔎 Detect Gradle version
        id: gv
        run: |
          FILES=$(ls build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle/libs.versions.toml 2>/dev/null || true)
          AGP=""
          if [ -n "$FILES" ]; then
            AGP=$(grep -hiE "agp|com\.android\.(application|library|tools\.build)" $FILES \
              | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1 || true)
          fi
          MM=$(echo "$AGP" | cut -d. -f1,2)
          case "$MM" in
            7.*)  G=7.6.4 ;;
            8.0|8.1) G=8.0 ;;
            8.2)  G=8.2 ;;
            8.3)  G=8.4 ;;
            8.4)  G=8.6 ;;
            8.5|8.6) G=8.7 ;;
            8.7)  G=8.9 ;;
            8.8)  G=8.10.2 ;;
            8.9|8.10) G=8.11.1 ;;
            8.11|8.12|8.13) G=8.13 ;;
            *)    G=8.9 ;;
          esac
          echo "AGP=${AGP:-haijapatikana} -> Gradle=$G" | tee logs/00-detect.log
          echo "version=$G" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: 🔍 Verify Gradle
        run: |
          {
            echo "=== Gradle Version ==="
            gradle --version
            echo "=== Java ==="
            java -version
          } 2>&1 | tee logs/02-verify.log

      - name: 🔨 Build Debug APK
        run: |
          if [ -x ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            CMD=./gradlew
          else
            CMD=gradle
          fi
          echo "Inatumia: $CMD" | tee logs/03-build-full.log
          $CMD assembleDebug --stacktrace --info --console=plain \
            2>&1 | tee -a logs/03-build-full.log

      # ---- Hatua zifuatazo zinaendeshwa hata build ikifeli ----

      - name: 🚨 Extract error logs
        if: always()
        run: |
          grep -nEi \
            "error:|^e: |FAILURE:|FAILED|What went wrong|Exception|Caused by|Execution failed|Could not (resolve|find)|AAPT|Unresolved reference|Duplicate class" \
            logs/*.log > logs/errors.log || echo "Hakuna errors zilizopatikana" > logs/errors.log

          {
            echo "## 🚨 Build Errors"
            echo '```'
            head -n 80 logs/errors.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/
            app/build/reports/
            **/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 30

      - name: 🚀 Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceTracker-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 📊 APK Info
        if: success()
        run: find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;
