name: 🏗️ Build DeviceTracker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repo
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Java 17
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Install Gradle
      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Automatically create Gradle Wrapper
      - name: 🔧 Generate Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      # 5. Verify wrapper
      - name: 🔍 Verify Gradle Wrapper
        run: |
          echo "=== Gradle Wrapper ==="
          ls -lah gradle/wrapper/
          echo "=== Gradle Version ==="
          ./gradlew --version

      # 6. Build Debug APK
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload APK
      - name: 🚀 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceTracker-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 8. APK Info
      - name: 📊 APK Info
        run: |
          echo "=== APK iliyotengenezwa ==="
          find app/build/outputs/apk/debug \
            -name "*.apk" \
            -exec ls -lh {} \;
